<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva tarea</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Nueva tarea</h1>
                    <form th:action="@{/tareas}" th:object="${tarea}" method="post">
                        <ul class="alert alert-danger"
                            th:if="${#fields.hasGlobalErrors()}">
                            <li th:each="error : ${#fields.globalErrors()}"
                                th:text="${error}"></li>
                        </ul>

                        <div class="mb-3">
                            <label class="form-label" for="titulo">Título</label>
                            <input id="titulo" class="form-control" type="text" th:field="*{titulo}">
                            <span class="text-danger small" th:errors="*{titulo}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="prioridad">Prioridad</label>
                            <select id="prioridad" class="form-select" th:field="*{prioridad}">
                                <option value="">Selecciona una prioridad</option>
                                <option th:each="p : ${prioridades}"
                                        th:value="${p}" th:text="${p}"></option>
                            </select>
                            <span class="text-danger small" th:errors="*{prioridad}"></span>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="fechaLimite">Fecha límite</label>
                            <input id="fechaLimite" class="form-control" type="date" th:field="*{fechaLimite}">
                            <span class="text-danger small" th:errors="*{fechaLimite}"></span>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Guardar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/tareas}">Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
