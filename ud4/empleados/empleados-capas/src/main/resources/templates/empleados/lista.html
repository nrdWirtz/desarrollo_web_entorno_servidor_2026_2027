<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de empleados</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3 mb-4">
    <div class="container">
        <a class="text-white text-decoration-none fs-5 fw-semibold" th:href="@{/empleados}">
            Gestión de empleados
        </a>
    </div>
</header>

<main class="container pb-5">
    <h1 class="h2 mb-4">Listado de empleados</h1>

    <div th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>

    <form method="get" th:action="@{/empleados}" class="row g-2 align-items-end mb-4">
        <div class="col-12 col-md-6">
            <label for="busqueda" class="form-label">Buscar por nombre</label>
            <input type="search" id="busqueda" name="busqueda" class="form-control"
                   placeholder="Escribe parte del nombre" th:value="${busqueda}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
        <div class="col-auto">
            <a th:href="@{/empleados}" class="btn btn-outline-secondary">Restablecer</a>
        </div>
    </form>

    <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Email</th>
                <th scope="col" class="text-end">Salario</th>
                <th scope="col" class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.id}"></td>
                <td th:text="${empleado.nombre}"></td>
                <td th:text="${empleado.email}"></td>
                <td class="text-end text-nowrap"
                    th:text="${empleado.salario} + ' €'"></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/empleados/{id}/editar(id=${empleado.id})}">Editar</a>
                    <form method="post" class="d-inline"
                          th:action="@{/empleados/{id}/eliminar(id=${empleado.id})}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Borrar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="5" class="text-center text-secondary py-4">No hay empleados</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/empleados/nuevo}" class="btn btn-primary mt-3">Nuevo empleado</a>
</main>
</body>
</html>
