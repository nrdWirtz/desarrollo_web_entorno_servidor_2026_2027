<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">

    <h1 class="h3 mb-4">Listado de empleados</h1>

    <!-- MENSAJES
         Aquí deben mostrarse los avisos de éxito y de error. Estructura de ejemplo:

         <div class="alert alert-success">Empleado guardado correctamente.</div>
         <div class="alert alert-danger">No existe ningún empleado con ese identificador.</div>
    -->

    <!-- BÚSQUEDA -->
    <form class="row g-2 mb-3">
        <div class="col-sm-6 col-md-4">
            <input type="text" class="form-control" id="texto" placeholder="Buscar por nombre">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <a href="#" class="btn btn-outline-secondary">Restablecer</a>
        </div>
    </form>

    <!-- LISTADO -->
    <table class="table table-striped table-bordered align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Salario</th>
            <th>Activo</th>
            <th>Género</th>
            <th>Editar</th>
            <th>Borrar</th>
        </tr>
        </thead>
        <tbody>
        <!-- FILA DE EJEMPLO: sustituir por una fila generada con th:each para cada empleado -->
        <tr>
            <td>1</td>
            <td>López Pérez, José</td>
            <td>jlp@gmail.com</td>
            <td>25000.0</td>
            <td>true</td>
            <td>MASCULINO</td>
            <td>
                <a href="#" class="btn btn-info btn-sm">Editar</a>
            </td>
            <td>
                <!-- El borrado modifica datos: se hace con un formulario POST, no con un enlace -->
                <form>
                    <button type="submit" class="btn btn-danger btn-sm">Borrar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a href="#" class="btn btn-primary">Nuevo empleado</a>

</div>
</body>
</html>
