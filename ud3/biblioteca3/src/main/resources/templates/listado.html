<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo | Mini biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container contenedor">
        <a class="navbar-brand fw-semibold" th:href="@{/listado}">Mini biblioteca</a>
        <span class="navbar-text text-white-50">Catálogo de libros</span>
    </div>
</nav>

<main class="container contenedor py-4 py-md-5">
    <h1 class="h2 mb-2">Nuestros libros</h1>
    <p class="text-secondary mb-4">Consulta el catálogo y gestiona los préstamos.</p>

    <section class="card border-0 shadow-sm mb-4" aria-label="Filtrar libros">
        <div class="card-body p-3 p-md-4">
            <form method="get" th:action="@{/listado}" class="row g-3 align-items-end">
                <div class="col-sm-7 col-md-6">
                    <label for="prestado" class="form-label">Estado del libro</label>
                    <select id="prestado" name="prestado" class="form-select">
                        <option value="" th:selected="${prestado == null}">Todos los libros</option>
                        <option value="false" th:selected="${prestado != null && prestado == false}">Disponibles</option>
                        <option value="true" th:selected="${prestado != null && prestado == true}">Prestados</option>
                    </select>
                </div>
                <div class="col-sm-auto">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/listado}" class="btn btn-outline-secondary ms-1">Ver todos</a>
                </div>
            </form>
        </div>
    </section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Catálogo</h2>
        <span class="text-secondary small" th:text="|Libros encontrados: ${#lists.size(libros)}|">Libros encontrados: 0</span>
    </div>

    <div th:if="${#lists.isEmpty(libros)}" class="alert alert-info" role="status">
        No hay libros con el estado seleccionado.
    </div>

    <div th:unless="${#lists.isEmpty(libros)}" class="card border-0 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Título</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="acciones">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="libro : ${libros}">
                    <th scope="row" class="fw-medium" th:text="${libro.titulo}">El principito</th>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${libro.prestado} ? 'text-bg-warning' : 'text-bg-success'"
                              th:text="${libro.prestado} ? 'Prestado' : 'Disponible'">Disponible</span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{/libro/{id}(id=${libro.id})}">Detalles</a>

                            <form method="post" th:action="@{/libro/toggle/{id}(id=${libro.id})}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${libro.prestado} ? 'btn-outline-primary' : 'btn-primary'"
                                        th:text="${libro.prestado} ? 'Devolver' : 'Prestar'"
                                        th:attr="aria-label=|${libro.prestado ? 'Devolver' : 'Prestar'}: ${libro.titulo}|">Prestar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
